version: '3.8'

# ==============================================================================
# CAMPROTEC SERVICE MAINTENANCE SYSTEM - PRODUCTION DOCKER COMPOSE
# Optimized for DigitalOcean Droplets / App Platform / VPS
# ==============================================================================

services:

  # ────────────────────────────────────────────────────────────
  # 1. FRONTEND: Next.js 16 Production Web Application (UI)
  # ────────────────────────────────────────────────────────────
  web-frontend:
    build:
      context: ./TestingReact
      dockerfile: Dockerfile
    container_name: servicemaintenance-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_TECHNICAL_API_URL=${NEXT_PUBLIC_TECHNICAL_API_URL:-https://technicalservicesapi.camprotec.com.kh}
      - NEXT_PUBLIC_JWT_API_URL=${NEXT_PUBLIC_JWT_API_URL:-https://user.camprotec.com.kh}
      - NEXT_PUBLIC_CUSTOMER_API_URL=${NEXT_PUBLIC_CUSTOMER_API_URL:-https://customerapi.camprotec.com.kh}
      - NEXT_PUBLIC_API_VERSION=1.0
      # Cloudflare R2 Storage (Image & Logo Uploads)
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-57672dc64a9d68fea854c7fae5c824f4}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-924edff78284ac069f992b0a05601b77}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-59ee20266e96641c7e476a1b050c22b3d464ec95da42f9ac4d1f0bc8c0abedd3}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-cam-storage}
      - R2_PUBLIC_BASE_URL=${R2_PUBLIC_BASE_URL:-https://pub-c837739939744d62afcc56caa2bda22b.r2.dev}
      # Google Gemini AI (Beta AI Assistant)
      - GEMINI_API_KEY=${GEMINI_API_KEY:-AQ.Ab8RN6JPKZugZI6whl7UwLgem42tO_iTO0MvCV94thuvEXw6ug}
      # AI Image Generation & Fallback
      - POLLINATIONS_API_KEY=${POLLINATIONS_API_KEY:-sk_NoSKUIcivP9SjAygcwVyyFmvKleuc8Vr}
      - POLLINATIONS_MODEL=${POLLINATIONS_MODEL:-zimage}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-57672dc64a9d68fea854c7fae5c824f4}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-cfut_5EiJQ7Snd0TDylvWegceWQKQ0XSTRrgzS7inZIvxb3dcb634}
      # Redis & Telegram
      - REDIS_URL=${REDIS_URL:-rediss://default:gQAAAAAAAl7XAAIgcDE5NDg0MGE1YTgzNGM0YWMyODFjOGZmMTY3OTA5MzI3MA@relaxing-dinosaur-155351.upstash.io:6379}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-8312370431:AAG_mkyfjtplELy5KTnScYcPHZwqQNEAEQw}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:--1004379506325}
    depends_on:
      - technical-api
      - user-auth-api
    networks:
      - app-network
    develop:
      watch:
        - action: rebuild
          path: ./TestingReact
          ignore:
            - node_modules/
            - .next/
            - .git/

  # ────────────────────────────────────────────────────────────
  # 2. BACKEND: TechnicalService.API (Core Repairs & Maintenance)
  # ────────────────────────────────────────────────────────────
  technical-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: technicalserviceapi
    container_name: technicalservice-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8000
      - DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=false
      - TZ=Asia/Phnom_Penh
      - ConnectionStrings__TechnicalServiceConnectionString=Server=${DB_SERVER};Database=${DB_TECHNICAL_NAME:-TechnicalServiceDB};User Id=${DB_USER};Password=${DB_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true;Max Pool Size=100;Min Pool Size=10;
      - Jwt__Enabled=false
    volumes:
      - technical-logs:/app/logs
      - spareparts:/app/wwwroot/images/spareparts
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8000/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    develop:
      watch:
        - action: rebuild
          path: ./src/APIs/TechnicalService.API
          ignore:
            - bin/
            - obj/
        - action: rebuild
          path: ./src/Core/TechnicalService.Domain
          ignore:
            - bin/
            - obj/
        - action: rebuild
          path: ./src/Shared/TechnicalService.Infrastructure
          ignore:
            - bin/
            - obj/
        - action: rebuild
          path: ./src/Shared/ServiceMaintenance.Infrastructure.Shared
          ignore:
            - bin/
            - obj/

  # ────────────────────────────────────────────────────────────
  # 3. BACKEND: UserManagementAPI (Auth, Passkeys, Face 2FA, SignalR)
  # ────────────────────────────────────────────────────────────
  user-auth-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: usermanagementapi
    container_name: usermanagement-api
    restart: unless-stopped
    ports:
      - "8087:8087"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8087
      - DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=false
      - TZ=Asia/Phnom_Penh
      - JWT__Secret=${JWT_SECRET:-${JWT_KEY}}
      - JWT__ValidIssuer=${JWT_ISSUER:-https://user.camprotec.com.kh}
      - JWT__ValidAudience=${JWT_AUDIENCE:-https://technicalsystem.camprotec.com.kh}
      - JWT__TokenValidityInHours=8
      - JWT__RefreshTokenValidityInDays=30
      - ConnectionStrings__UserManagementConnection=Server=${DB_SERVER};Database=${DB_USER_NAME:-EngineerUserDB};User Id=${DB_USER};Password=${DB_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true;Max Pool Size=100;Min Pool Size=10;
      - AuthMessageSenderOptions__SmtpServer=smtp.gmail.com
      - AuthMessageSenderOptions__SmtpUsername=${SMTP_USERNAME}
      - AuthMessageSenderOptions__SmtpPassword=${SMTP_PASSWORD}
      - AuthMessageSenderOptions__SmtpFromEmail=${SMTP_USERNAME}
      - WebAuthn__ServerDomain=${WEBAUTHN_DOMAIN:-camprotec.com.kh}
      - WebAuthn__ServerName=Camprotec Service Maintenance
    volumes:
      - user-dataprotection-keys:/app/dataprotection-keys
      - user-uploads:/app/wwwroot/uploads
      - user-logs:/app/logs
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8087/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    develop:
      watch:
        - action: rebuild
          path: ./src/APIs/UserManagementAPI
          ignore:
            - bin/
            - obj/
        - action: rebuild
          path: ./src/Shared/ServiceMaintenance.Infrastructure.Shared
          ignore:
            - bin/
            - obj/

  # ────────────────────────────────────────────────────────────
  # 4. BACKEND: EmployeeManagement.Api (Staff & Customer Registry)
  # ────────────────────────────────────────────────────────────
  employee-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: employeemanagementapi
    container_name: employeemanagement-api
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8081
      - DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=false
      - TZ=Asia/Phnom_Penh
      - ConnectionStrings__DBConnection=Server=${DB_SERVER};Database=${DB_EMPLOYEE_NAME:-EmployeeDB};User Id=${DB_USER};Password=${DB_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true;Max Pool Size=50;Min Pool Size=5;
    volumes:
      - employee-logs:/app/logs
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

# ==============================================================================
# PERSISTENT VOLUMES
# ==============================================================================
volumes:
  user-dataprotection-keys:
    driver: local
  user-uploads:
    driver: local
  spareparts:
    driver: local
  technical-logs:
    driver: local
  user-logs:
    driver: local
  employee-logs:
    driver: local

# ==============================================================================
# INTERNAL NETWORKS
# ==============================================================================
networks:
  app-network:
    driver: bridge